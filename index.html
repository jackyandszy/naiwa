<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B站视频播放</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
  }

  .container {
    width: 100%;
    max-width: 1000px;
  }

  .card {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
  }

  .title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .title::before {
    content: "";
    width: 5px;
    height: 20px;
    border-radius: 3px;
    background: linear-gradient(180deg, #fb7299, #ff9db5);
  }

  .subtitle {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 16px;
  }

  /* 16:9 自适应视频容器 */
  .video-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }

  .video-wrap iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .footer {
    margin-top: 14px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
    text-align: right;
  }

  @media (max-width: 600px) {
    .card { padding: 14px; border-radius: 14px; }
    .title { font-size: 17px; }
    body { padding: 14px; }
  }
</style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1 class="title">奶娃大笑</h1>

      <div class="video-wrap">
        <iframe
          src="https://player.bilibili.com/player.html?isOutside=true&aid=116853829541306&bvid=BV1p2Tp6REay&cid=39607405800&p=1&autoplay=true&danmaku=0&high_quality=0"
          scrolling="no"
          border="0"
          frameborder="no"
          framespacing="0"
          allowfullscreen="true"
          sandbox="allow-top-navigation allow-same-origin allow-forms allow-scripts allow-popups"
        ></iframe>
      </div>

      <div class="footer">不言而喻</div>
    </div>
  </div>

</body>
</html>
